[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-compliance-capstone"
version = "1.0.0"
description = "Evidence-grounded compliance copilot with monolithic and multi-agent architectures"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langsmith>=0.4,<1.0",
  "openai>=1.109,<3.0",
  "gradio>=5.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[project.scripts]
compliance-eval = "complianceops.evaluation:main"
compliance-baseline = "complianceops.baseline:main"
compliance-prompts = "complianceops.prompt_compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
complianceops = ["fixtures/*.json", "fixtures/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
